[pytest]
testpaths = tests
pythonpath = src
addopts = --alluredir=allure-results -ra --strict-markers
    --cov=task_manager --cov-report=term-missing --cov-report=html
markers =
    smoke: быстрые проверки основного CRUD-сценария
    negative: сценарии с ошибками и невалидными данными
    concurrency: параллельный доступ нескольких потоков к одной задаче
