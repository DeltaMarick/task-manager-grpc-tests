[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "src/task_manager/generated"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/task_manager/generated"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.coverage.run]
omit = ["*/generated/*"]
